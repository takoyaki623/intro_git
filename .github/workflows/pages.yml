name: Deploy to GitHub Pages

# ビルドが要らない静的サイトなので、リポジトリの中身をそのまま publish する。
# configure-pages の enablement で Pages 自体もこのワークフローが有効化するため、
# Settings を手で触らなくても URL が生える。

on:
  push:
    branches:
      - master
      - claude/pokemon-style-game-s4v9rf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。進行中のデプロイは待たせて、最新のものを反映する。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages をセットアップ（未設定なら有効化する）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 静的ファイルをまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
