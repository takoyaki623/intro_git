<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- ホーム画面用のアイコン。モンスターボールをドットで描いたもの。 -->
  <rect width="32" height="32" fill="#101018"/>
  <g fill="#2a1c18">
    <rect x="10" y="4" width="12" height="2"/>
    <rect x="8"  y="6" width="2"  height="2"/><rect x="22" y="6" width="2" height="2"/>
    <rect x="6"  y="8" width="2"  height="2"/><rect x="24" y="8" width="2" height="2"/>
    <rect x="4"  y="10" width="2" height="4"/><rect x="26" y="10" width="2" height="4"/>
    <rect x="4"  y="18" width="2" height="4"/><rect x="26" y="18" width="2" height="4"/>
    <rect x="6"  y="22" width="2" height="2"/><rect x="24" y="22" width="2" height="2"/>
    <rect x="8"  y="24" width="2" height="2"/><rect x="22" y="24" width="2" height="2"/>
    <rect x="10" y="26" width="12" height="2"/>
  </g>
  <!-- 上半分：赤 -->
  <g fill="#e04030">
    <rect x="10" y="6"  width="12" height="2"/>
    <rect x="8"  y="8"  width="16" height="2"/>
    <rect x="6"  y="10" width="20" height="4"/>
  </g>
  <!-- 下半分：白 -->
  <g fill="#f8f8f8">
    <rect x="6"  y="18" width="20" height="4"/>
    <rect x="8"  y="22" width="16" height="2"/>
    <rect x="10" y="24" width="12" height="2"/>
  </g>
  <!-- 中央のライン -->
  <rect x="4" y="14" width="24" height="4" fill="#2a1c18"/>
  <!-- ボタン -->
  <rect x="12" y="12" width="8" height="8" fill="#2a1c18"/>
  <rect x="13" y="13" width="6" height="6" fill="#f8f8f8"/>
  <rect x="14" y="14" width="4" height="4" fill="#c8c8d0"/>
</svg>
