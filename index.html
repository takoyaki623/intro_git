<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101018">
<meta name="description" content="ブラウザで動く、ポケモン風のドット絵RPG。">
<!-- ホーム画面に追加したときアドレスバーなしの全画面で起動する -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ドットのぼうけん">
<link rel="manifest" href="./manifest.webmanifest">
<title>ポケットモンスター風RPG</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="256" height="192"></canvas>
  </div>

  <!-- タッチ操作。表示・非表示は screen.js が body.touch で切り替える。 -->
  <div id="touch" hidden>
    <!-- 十字キーは #dpad がまとめて判定する。中の4枚は見た目だけ。 -->
    <div id="dpad" role="group" aria-label="じゅうじキー">
      <div class="pad up"    aria-hidden="true"></div>
      <div class="pad left"  aria-hidden="true"></div>
      <div class="pad right" aria-hidden="true"></div>
      <div class="pad down"  aria-hidden="true"></div>
    </div>
    <button id="menu-btn" class="rb" data-key="KeyC" aria-label="メニュー">☰</button>
    <div id="btns">
      <button class="rb" data-key="KeyX" aria-label="キャンセル">B</button>
      <button class="rb" data-key="KeyZ" aria-label="けってい">A</button>
    </div>
  </div>

  <!-- セーブの文字列入出力(A3)。canvasはテキストの選択・貼り付けができないので、
       ここだけは実DOMの textarea を使う。表示・非表示は ioOverlay.js が切り替える。 -->
  <div id="io-overlay" hidden>
    <div id="io-box">
      <p id="io-label"></p>
      <textarea id="io-text" rows="6" spellcheck="false"></textarea>
      <p id="io-msg"></p>
      <div id="io-actions">
        <button id="io-confirm" type="button"></button>
        <button id="io-cancel" type="button">とじる</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
